name: Publish Translator to NPM
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0)'
        required: true
        type: string
permissions:
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Check
        working-directory: ./translator
        run: |
          npm ci
          npm run check
      - name: Publish to NPM
        working-directory: ./translator
        run: |
          npm run build
          npm version ${{ inputs.version }} --no-git-tag-version
          npm publish
